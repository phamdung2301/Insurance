spring.application.name=insuranceAss
server.port=${SERVER_PORT:8080}

# Tomcat Windows Temp Fix
server.tomcat.basedir=target/tomcat
server.tomcat.session.persistent=false

# MongoDB Configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:insuranceass}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# JWT_SECRET: BẮT BUỘC đặt khi production. Secret cũ từng nằm trong repo public -> đã lộ, hãy tạo mới.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.emails=${ADMIN_EMAILS:dungphdse@gmail.com,admin@insurtech.vn}

# Spring Mail (Gmail SMTP) — cần App Password 16 ký tự (không dấu cách)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security & Rate Limiting Configuration
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
app.security.rate-limit.auth.duration-seconds=${RATE_LIMIT_AUTH_DURATION:60}
app.security.rate-limit.docs.capacity=${RATE_LIMIT_DOCS_CAPACITY:15}
app.security.rate-limit.docs.duration-seconds=${RATE_LIMIT_DOCS_DURATION:60}
app.security.rate-limit.general.capacity=${RATE_LIMIT_GENERAL_CAPACITY:100}
app.security.rate-limit.general.duration-seconds=${RATE_LIMIT_GENERAL_DURATION:60}

# Google OAuth2 (đăng nhập bằng Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Dev Quick Switch (tab "Đăng nhập dev" ở FE) — MẶC ĐỊNH TẮT. Chỉ bật khi dev local.
app.dev.quick-switch-enabled=${DEV_QUICK_SWITCH:false}

# CORS Allowed Origins (phân cách bằng dấu phẩy, không dấu cách)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
